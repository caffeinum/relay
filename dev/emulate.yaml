slack:
  team:
    name: 2027dev (emulated)
    domain: dev2027
  users:
    - name: aleks
      real_name: Aleks
      email: aleks@example.com
      is_admin: true
      profile:
        display_name: aleks
        title: Founder
        image_48: https://i.pravatar.cc/96?u=aleks
    - name: mira
      real_name: Mira Chen
      email: mira@example.com
      profile:
        display_name: Mira
        title: Design
        image_48: https://i.pravatar.cc/96?u=mira
    - name: tomas
      real_name: Tomás Ruiz
      email: tomas@example.com
      profile:
        title: Backend
        image_48: https://i.pravatar.cc/96?u=tomas
  channels:
    - name: general
      topic: Company-wide
    - name: engineering
      topic: Builds and bugs
    - name: customers
      topic: Customer threads
    - name: random
  usergroups:
    - handle: design-team
      name: Design team
      users: [mira, aleks]
    - handle: backend
      name: Backend
      users: [tomas]
  emoji:
    shipit: https://emoji.slack-edge.com/T0/shipit/shipit.png
  # A bot that posts: its user is U0DEPLOY01 and its messages carry bot_id B0DEPLOY01.
  oauth_apps:
    - client_id: deploybot-client
      client_secret: deploybot-secret
      name: Deploybot
      redirect_uris: []
      bot_id: B0DEPLOY01
      bot_user_id: U0DEPLOY01
      bot_name: deploybot
    # The internal app itself: Socket Mode connects with its xapp token.
    - client_id: relay-client
      client_secret: relay-secret
      name: Relay
      redirect_uris: []
      app_id: A0RELAY
      bot_id: B0RELAY
      bot_user_id: U0RELAYBOT
      bot_name: relay
  tokens:
    - token: xoxp-emu-aleks
      user: aleks
    - token: xoxp-emu-mira
      user: mira
    - token: xoxp-emu-tomas
      user: tomas
    - token: xoxb-emu-deploybot
      type: bot
      user_id: U0DEPLOY01
      bot_id: B0DEPLOY01
    - token: xapp-emu-relay
      type: app
      app_id: A0RELAY
